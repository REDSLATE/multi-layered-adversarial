[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
# 2026-02-17: skip destructive live-API tests by default. They mutate
# the operator-curated preview DB (roster reset, seat wipe, system-
# flags cleanup) and destroyed the crypto seat assignments during a
# routine full-suite run today. Run explicitly with:
#     pytest -m destructive
# in a scratch DB / paper environment ONLY.
addopts = -m "not destructive"
filterwarnings =
    ignore::PendingDeprecationWarning
markers =
    tripwire: locked-behavior tests that pin the council/auto-router/diagnose contracts. Run with `pytest -m tripwire` before merging any edit to shared/council.py, shared/auto_router.py, or shared/execution.py.
    destructive: tests that mutate the operator-curated preview/prod DB (roster reset, seat wipe, system-flags cleanup). SKIPPED by default; run with `pytest -m destructive` in a scratch DB only. See 2026-02-17 seat-wipe incident.
